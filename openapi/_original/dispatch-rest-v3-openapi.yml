info:
  title: Dispatch REST API v3
  version: '3'
  summary: Field-service orchestration API for jobs, customers, organizations, appointments and work orders.
  description: >-
    The Dispatch REST API lets job sources (warranty companies, equipment manufacturers,
    lead-generation platforms) and service enterprises interact with Dispatch's core
    business objects to implement their service workflow on the Dispatch platform.
    Job sources authenticate with OAuth 2.0 client credentials; individual service
    providers authenticate with the resource-owner password grant.
  contact:
    name: Dispatch
    url: https://dispatch.me/contact
    email: sales@dispatch.me
  x-documentation: https://github.com/DispatchMe/v3-api-docs
servers:
  - url: https://api.dispatch.me
    description: Production
  - url: https://api-sandbox.dispatch.me
    description: Sandbox
tags:
  - name: Authentication
    description: OAuth 2.0 token issuance and refresh.
  - name: Appointments
    description: Scheduled times at which an assigned technician performs work for a job.
  - name: Brands
    description: Brands or divisions controlling logo and copy. Accessible only to job sources.
  - name: Customers
    description: The homeowner or end customer a job belongs to.
  - name: Jobs
    description: A single body of work for a customer, assigned to an organization.
  - name: Organizations
    description: The branch or third-party service provider responsible for doing the work.
  - name: Sources
    description: Where job information originated.
  - name: Survey Responses
    description: Customer surveys sent when an appointment or job completes.
  - name: Users
    description: Dispatchers and technicians using the Dispatch applications.
  - name: Work Orders
    description: Composite object creating jobs, customers, organizations and appointments in one call.
security:
  - bearerAuth: []
paths:
  /v3/oauth/token:
    post:
      operationId: createToken
      tags: [Authentication]
      summary: Retrieve or refresh a bearer token
      description: >-
        Exchange credentials for an OAuth 2.0 bearer token. Job sources use the
        client_credentials grant; a single service provider uses the password grant.
        Tokens are temporary - handle 401 responses by retrieving a new token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ClientCredentialsGrant'
                - $ref: '#/components/schemas/PasswordGrant'
                - $ref: '#/components/schemas/RefreshTokenGrant'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v3/appointments:
    post:
      operationId: createAppointment
      tags: [Appointments]
      summary: Create an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appointment: { $ref: '#/components/schemas/Appointment' }
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointment: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      operationId: listAppointments
      tags: [Appointments]
      summary: List appointments
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: filter[job_id_eq]
          in: query
          description: Parent job ID
          schema: { type: integer }
        - name: filter[job_id_in]
          in: query
          description: Parent job IDs (comma separated)
          schema: { type: string }
        - name: filter[organization_id_eq]
          in: query
          description: Parent organization ID
          schema: { type: integer }
        - name: filter[status_eq]
          in: query
          description: Appointments in a specific status
          schema: { $ref: '#/components/schemas/AppointmentStatus' }
        - name: filter[status_in]
          in: query
          description: Specific statuses (comma separated)
          schema: { type: string }
        - name: filter[time_gt]
          in: query
          description: Appointments scheduled after the given ISO8601 time
          schema: { type: string, format: date-time }
        - name: filter[time_gteq]
          in: query
          description: Appointments scheduled on or after the given ISO8601 time
          schema: { type: string, format: date-time }
        - name: filter[time_lt]
          in: query
          description: Appointments scheduled before the given ISO8601 time
          schema: { type: string, format: date-time }
        - name: filter[time_lteq]
          in: query
          description: Appointments scheduled on or before the given ISO8601 time
          schema: { type: string, format: date-time }
        - name: filter[user_id_eq]
          in: query
          description: Appointments assigned to a particular technician
          schema: { type: integer }
        - name: filter[user_id_in]
          in: query
          description: Appointments assigned to technicians (comma separated)
          schema: { type: string }
        - name: filter[user_id_null]
          in: query
          description: Show unassigned appointments (value should be true)
          schema: { type: boolean }
      responses:
        '200':
          description: A list of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /v3/appointments/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getAppointment
      tags: [Appointments]
      summary: View a single appointment
      responses:
        '200':
          description: The appointment
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointment: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAppointment
      tags: [Appointments]
      summary: Update an appointment
      description: >-
        Scheduling an appointment also moves its parent job to the "scheduled" status.
        Canceling a job cancels all of its child appointments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appointment: { $ref: '#/components/schemas/Appointment' }
      responses:
        '200':
          description: The updated appointment
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointment: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deleteAppointment
      tags: [Appointments]
      summary: Delete an appointment
      responses:
        '204': { description: Appointment deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

