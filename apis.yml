aid: dispatch
name: Dispatch
description: >-
  Dispatch (Dispatch Technologies, Boston MA) is a service-orchestration platform for
  enterprises that fulfil work through networks of independent contractors and third-party
  service providers - manufacturer warranty, home and property claims, retail, franchise
  and proptech. Dispatch gives the brand visibility into work performed by providers who
  keep using their own field-service tools, and gives the homeowner a tracked, branded
  service experience. Its public REST API v3 exposes the core business objects - jobs,
  customers, organizations, appointments, users, sources, brands, survey responses and
  composite work orders - to job sources such as warranty companies and equipment
  manufacturers, and to service enterprises running first-party branch networks. The API
  is secured with OAuth 2.0 bearer tokens, offers a full sandbox environment, and is
  documented in a public GitHub repository.
