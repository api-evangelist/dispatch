x-identity-note: >-
  This slug was created from VC portfolio harvests that list only the name "Dispatch" with
  no domain, and at least three unrelated companies share it. This repo profiles Dispatch
  Technologies (dispatch.me), the field-service orchestration platform - the identity
  confirmed by a live public API and a GitHub organization (github.com/DispatchMe) whose
  homepage field points at dispatch.me. The Y Combinator entry
  (ycombinator.com/companies/dispatch, Spring 2026) is a different company: Dispatch, the
  space-logistics firm at dispatch.space building reentry vehicles and orbital
  infrastructure - it has no API surface and should be split into its own slug. A third
  namesake, dispatch.io, sells client-data onboarding to financial advisors and runs a
  non-public API at api.dispatch.io with no published developer documentation. The
  x-backed-by list is therefore unreliable for this repo and should be re-attributed when
  the portfolio entries are disambiguated.
x-namesakes:
- name: Dispatch (space logistics)
  url: https://dispatch.space/
  source: https://www.ycombinator.com/companies/dispatch
  note: >-
    Y Combinator Spring 2026. Reentry vehicles and orbital infrastructure for space
    manufacturing. No API surface. Needs its own slug.
- name: Dispatch (advisor client data)
  url: https://dispatch.io/
  note: >-
    Client-data onboarding and sync for financial advisors. api.dispatch.io responds but
    publishes no developer documentation.
