auth:
  model: oauth2-bearer
  note: A server would exchange a Dispatch public/secret key pair for a bearer token at POST /v3/oauth/token
    and refresh on 401. Point it at https://api-sandbox.dispatch.me while developing.
  detail: authentication/dispatch-authentication.yml
safety_notes:
- Write operations affect real dispatched field work - creating or canceling a work order offers or withdraws
  a job from a live service provider. Gate create/update/cancel/delete tools behind confirmation.
- Dispatch documents no idempotency key, so a retried write is not safe to replay. Use the external_ids
  field to correlate caller-side records instead.
- Delete on users is a deactivation and is reversible via reactivateUser; delete on appointments, brands,
  customers and organizations is not documented as reversible.
