changelog:
  published: false
  note: >-
    Dispatch publishes no dated API changelog. The docs repository
    (DispatchMe/v3-api-docs) carries a CHANGELOG.md, but it belongs to the upstream Slate
    documentation generator the site is built on, not to the Dispatch API - it is
    deliberately not captured as a changelog/ artifact.
